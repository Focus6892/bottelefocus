name: Nghiên cứu VP biến động và scalp

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Số ngày lịch sử 1h và 15m"
        default: "1095"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tải lịch sử, nghiên cứu VP, backtest scalp
        run: |
          set -o pipefail
          {
            python backtest/fetch_history.py 2200 1Dutc &&
            python backtest/fetch_history.py ${{ inputs.days }} 4H,1H,15m &&
            python backtest/vp_vol.py &&
            python backtest/scalp.py 1h &&
            python backtest/scalp.py 15m
          } 2>&1 | tee backtest/research_log.txt
      - name: Lưu kết quả
        if: always()
        run: |
          git config user.name "bottelefocus"
          git config user.email "bot@users.noreply.github.com"
          # Chạy chồng nhau (cron + chạy tay) từng làm mất kết quả vì rebase xung đột: lấy đầu nhánh mới nhất,
          # đặt kết quả của lần chạy này lên trên rồi đẩy, thử lại vài lần nếu bị từ chối.
          for i in 1 2 3 4; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q FETCH_HEAD
            git add backtest/vp_vol.md backtest/vp_vol.json backtest/scalp_*.md backtest/scalp_*.json backtest/research_log.txt
            git diff --cached --quiet && exit 0
            git commit -q -m "research: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((5 * i))
          done
          echo "không đẩy được kết quả sau 4 lần" >&2
          exit 1
