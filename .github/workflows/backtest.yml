name: Backtest xu hướng

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Số ngày lịch sử"
        default: "1095"
      scalp:
        description: "Chạy cả 15m và 30m"
        type: boolean
        default: true
      short:
        description: "Chạy khung ngắn hạn 1h và 15m (365 ngày)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tải lịch sử và chạy backtest
        run: |
          set -o pipefail
          {
            python backtest/fetch_history.py 2200 1Dutc,1Wutc &&
            python backtest/fetch_history.py ${{ inputs.days }} 4H &&
            python backtest/run.py 4h &&
            python backtest/run.py 1d &&
            if [ "${{ inputs.scalp }}" != "false" ]; then
              python backtest/fetch_history.py 365 15m,30m &&
              python backtest/run.py 15m &&
              python backtest/run.py 30m
            fi &&
            if [ "${{ inputs.short }}" = "true" ]; then
              python backtest/fetch_history.py 365 1H,15m &&
              python backtest/run.py 1h &&
              python backtest/run.py 15m
            fi
          } 2>&1 | tee backtest/last_run.log
      - name: Lưu kết quả
        if: always()
        run: |
          git config user.name "bottelefocus"
          git config user.email "bot@users.noreply.github.com"
          git add backtest/results*.md backtest/results*.json backtest/last_run.log
          git diff --cached --quiet || git commit -m "backtest: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
