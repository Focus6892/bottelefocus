name: Backtest xu hướng

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Số ngày lịch sử"
        default: "1095"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tải lịch sử và chạy backtest
        run: |
          python backtest/fetch_history.py ${{ inputs.days }}
          python backtest/run.py
      - name: Lưu kết quả
        if: always()
        run: |
          git config user.name "bottelefocus"
          git config user.email "bot@users.noreply.github.com"
          git add backtest/results.md backtest/results.json
          git diff --cached --quiet || git commit -m "backtest: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
