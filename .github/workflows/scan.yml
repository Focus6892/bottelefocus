name: Quét chỉ báo BTC ETH SOL

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Gửi bản tin tổng hợp ngay"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Chạy bộ chỉ báo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.digest }}" = "true" ]; then
            python -m bot.main --digest
          else
            python -m bot.main
          fi
      - name: Lưu trạng thái
        run: |
          git config user.name "bottelefocus"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
