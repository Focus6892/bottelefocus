name: Backtest scalp đa khung

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Số ngày lịch sử nến 5m (gộp thành 15m, 30m, 1h)"
        default: "1095"
      frames:
        description: "Khung chạy, cách nhau dấu phẩy"
        default: "5m,15m,30m,1h"

permissions:
  contents: write

concurrency:
  group: scalp-mtf
  cancel-in-progress: false

jobs:
  scalp-mtf:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Giữ nến đã tải giữa các lần chạy: lần sau chỉ tải phần mới
      - uses: actions/cache@v4
        with:
          path: backtest/data
          key: okx-ohlc-${{ github.run_id }}
          restore-keys: okx-ohlc-
      - name: Tải lịch sử và chạy backtest scalp đa khung
        run: |
          set -o pipefail
          {
            python backtest/fetch_history.py 2200 1Dutc &&
            python backtest/fetch_history.py $(( ${{ inputs.days }} + 60 )) 4H &&
            python backtest/fetch_history.py ${{ inputs.days }} 5m &&
            python backtest/scalp_mtf.py ${{ inputs.frames }}
          } 2>&1 | tee backtest/scalp_mtf_log.txt
      - name: Lưu kết quả
        if: always()
        run: |
          git config user.name "bottelefocus"
          git config user.email "bot@users.noreply.github.com"
          # Chạy chồng nhau (cron + chạy tay) từng làm mất kết quả vì rebase xung đột: lấy đầu nhánh mới nhất,
          # đặt kết quả của lần chạy này lên trên rồi đẩy, thử lại vài lần nếu bị từ chối.
          for i in 1 2 3 4; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q FETCH_HEAD
            git add backtest/scalp_mtf.md backtest/scalp_mtf.json backtest/scalp_mtf_log.txt
            git diff --cached --quiet && exit 0
            git commit -q -m "scalp-mtf: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((5 * i))
          done
          echo "không đẩy được kết quả sau 4 lần" >&2
          exit 1
